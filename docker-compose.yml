# Local development stack. Infrastructure ports bind to 127.0.0.1 only, so
# nothing but the API and the GPS port (phones report there) is reachable
# from other machines.
services:
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    ports: ["4000:4000"]
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: onixus
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  # Open-source GPS server (Apache 2.0). Web UI on :8082; phones running the
  # Traccar Client app report to :5055.
  traccar:
    image: traccar/traccar:6.16
    ports: ["127.0.0.1:8082:8082", "5055:5055"]
    volumes: ["traccar:/opt/traccar/data"]
  ollama:
    image: ollama/ollama
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama:/root/.ollama"]
volumes:
  pgdata:
  traccar:
  ollama:
